# caos-agent-harness project file. Paths are relative to this file.
[board]
db = ".harness/board.db"
trace = ".harness/trace.db"

# Fast testing / simulated agent
[agents.echo]
command = ["cat"]
timeout = 30

# Local LLM agents via Ollama
[agents.llama]
command = ["ollama", "run", "llama3.2:3b"]
system = "llama3.2:3b"
timeout = 180

[agents.qwen]
command = ["ollama", "run", "qwen2.5:7b"]
system = "qwen2.5:7b"
timeout = 300

[agents.claude]
command = ["claude", "-p"]
timeout = 600

[agents.codex]
command = ["codex", "exec", "-"]
timeout = 600

# Antigravity CLI: the prompt is the value of -p (placeholder), not stdin
[agents.agy]
command = ["agy", "--mode", "accept-edits", "--output-format", "text", "-p", "{prompt}"]
timeout = 600

[agents.opencode]
command = ["opencode", "run", "-m", "opencode/glm-5.3-flash-free"]
timeout = 600
